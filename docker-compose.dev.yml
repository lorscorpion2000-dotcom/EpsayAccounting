version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: epsay_postgres_dev
    environment:
      POSTGRES_DB: epsay_dev
      POSTGRES_USER: epsay
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
